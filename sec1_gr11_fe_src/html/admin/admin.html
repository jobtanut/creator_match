<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorMatch - Admin</title>
    <link rel="stylesheet" href="/style/styles.css">
    <style>
        .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; }
        .inactive { opacity: 0.5; }
        .form-message { margin-top: 8px; }
        .form-message.error { color: #d33; }
        .form-message.success { color: #2a8a3e; }
    </style>
</head>
<body>
<header>
    <nav>
        <div class="logo"><a href="/">CreatorMatch</a></div>
        <div id="nav-links"></div>
    </nav>
</header>

<main class="container">
    <h1>Creator Management</h1>

    <section class="panel">
        <h2 id="formTitle">Add Creator</h2>

        <form id="creatorForm">
            <label for="creator_name">Creator Name</label>
            <input type="text" id="creator_name" name="creator_name" maxlength="100" required>

            <label for="category">Category</label>
            <select id="category" name="category">
                <option>Food</option>
                <option>Lifestyle</option>
                <option>Fashion</option>
                <option>Technology</option>
            </select>

            <label for="c_first_name">First Name</label>
            <input type="text" id="c_first_name" name="c_first_name" maxlength="50">

            <label for="c_last_name">Last Name</label>
            <input type="text" id="c_last_name" name="c_last_name" maxlength="50">

            <label for="followers">Followers</label>
            <input type="number" id="followers" name="followers" min="0" value="0">

            <label for="platforms">Platforms (comma separated)</label>
            <input type="text" id="platforms" name="platforms" placeholder="YouTube, TikTok, Instagram">

            <label for="Description">Description</label>
            <input type="text" id="Description" name="Description" maxlength="255">

            <label for="Status">Status</label>
            <select id="Status" name="Status">
                <option>Active</option>
                <option>Inactive</option>
            </select>

            <label for="picture">Picture</label>
            <input type="file" id="picture" name="picture" accept="image/*,.heic,.heif">

            <button class="button" type="submit" id="submitButton">Add Creator</button>
            <button class="button" type="button" id="cancelButton" hidden>Cancel</button>

            <p id="formMessage" class="form-message"></p>
        </form>
    </section>

    <section>
        <h2>Creator List</h2>

        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>ID</th>
                    <th>Creator</th>
                    <th>Category</th>
                    <th>Followers</th>
                    <th>Platforms</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="creatorRows">
                <tr><td colspan="8">Loading...</td></tr>
            </tbody>
        </table>
    </section>
</main>

<footer>
    <p>CreatorMatch &copy; 2026</p>
</footer>

<script src="/js/nav.js"></script>
<script>requireAdmin();</script>
<script src="/js/admin.js"></script>
</body>
</html>
