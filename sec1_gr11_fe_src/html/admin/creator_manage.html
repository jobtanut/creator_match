<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorMatch - Add Creator</title>
    <link rel="stylesheet" href="/style/styles.css">
    <style>
        .drop-zone {
            border: 2px dashed #999; border-radius: 8px; padding: 20px;
            text-align: center; cursor: pointer; margin-bottom: 12px;
        }
        .drop-zone.dragging { border-style: solid; background: #f0f0f0; }
        .drop-zone { display: block; }
        .drop-zone img { display: block; margin: 10px auto 0; }

        .visually-hidden {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); border: 0;
        }
        .drop-zone img { max-width: 120px; max-height: 120px; margin-top: 10px; object-fit: cover; }
        .form-message.error { color: #d33; }
        .form-message.success { color: #2a8a3e; }
    </style>
</head>
<body>
<header>
    <nav>
        <div class="logo"><a href="/">CreatorMatch</a></div>
        <div id="nav-links"></div>
    </nav>
</header>

<main class="container">
    <p><a class="button" href="/admin/creators">Back to Creator Management</a></p>

    <section class="panel">
        <h1 id="formTitle">Add Creator</h1>

        <form id="creatorForm">
            <label for="creator_name">Creator Name</label>
            <input type="text" id="creator_name" name="creator_name" maxlength="100" required>

            <label for="category">Category</label>
            <select id="category" name="category">
                <option>Food</option>
                <option>Lifestyle</option>
                <option>Fashion</option>
                <option>Technology</option>
            </select>

            <label for="c_first_name">First Name</label>
            <input type="text" id="c_first_name" name="c_first_name" maxlength="50">

            <label for="c_last_name">Last Name</label>
            <input type="text" id="c_last_name" name="c_last_name" maxlength="50">

            <label for="followers">Followers</label>
            <input type="number" id="followers" name="followers" min="0" value="0">

            <label for="platforms">Platforms (comma separated)</label>
            <input type="text" id="platforms" name="platforms" placeholder="YouTube, TikTok, Instagram">

            <label for="Description">Description</label>
            <input type="text" id="Description" name="Description" maxlength="255">

            <label for="Status">Status</label>
            <select id="Status" name="Status">
                <option>Active</option>
                <option>Inactive</option>
            </select>

            <p><b>Picture</b></p>
            <label class="drop-zone" id="dropZone" for="picture">
                <span id="dropText">Drag and drop a picture here, or click to choose</span>
                <img id="dropPreview" alt="" hidden>
            </label>
            <input type="file" id="picture" name="picture" accept="image/*,.heic,.heif" class="visually-hidden">
                        <input type="hidden" id="remove_picture" name="remove_picture" value="0">
            <p><button class="button button-clear" type="button" id="clearPictureButton" hidden>Clear Picture</button></p>
            <button class="button" type="submit" id="submitButton">Add Creator</button>
            <a class="button" href="/admin/creators">Cancel</a>
            <button class="button" type="button" id="deleteButton" hidden>Delete Creator</button>

            <p id="formMessage" class="form-message"></p>
        </form>
    </section>
</main>

<footer>
    <p>CreatorMatch &copy; 2026</p>
</footer>

<script src="/js/nav.js"></script>
<script>requireAdmin();</script>
<script src="/js/admin/common.js"></script>
<script src="/js/admin/creator_manage.js"></script>
</body>
</html>
