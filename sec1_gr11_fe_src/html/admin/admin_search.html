<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorMatch - Admin Accounts</title>
    <link rel="stylesheet" href="/style/styles.css">
    <style>
        .form-message.error { color: #d33; }
        .form-message.success { color: #2a8a3e; }
    </style>
</head>
<body>
<header>
    <nav>
        <div class="logo"><a href="/">CreatorMatch</a></div>
        <div id="nav-links"></div>
    </nav>
</header>

<main class="container">
    <h1>Admin Manage</h1>
    <p>
        <a class="button" href="/admin/adminmanage">Add Admin</a>
        <a class="button" href="/admin">Back to Admin Menu</a>
    </p>

    <section class="panel">
        <h2>Search Admins</h2>
        <form id="adminSearchForm">
            <label for="searchName">Name or Username</label>
            <input type="text" id="searchName">

            <label for="searchEmail">Email</label>
            <input type="text" id="searchEmail">

            <label for="searchPosition">Position</label>
            <input type="text" id="searchPosition">

            <button class="button" type="submit">Search</button>
            <button class="button" type="button" id="searchClear">Clear</button>
        </form>
    </section>

    <section>
        <h2 id="adminListTitle">Admin List</h2>
        <p id="listMessage" class="form-message"></p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Position</th>
                    <th>Team Member</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminRows">
                <tr><td colspan="7">Loading...</td></tr>
            </tbody>
        </table>
    </section>
</main>

<footer>
    <p>CreatorMatch &copy; 2026</p>
</footer>

<script src="/js/nav.js"></script>
<script>requireAdmin();</script>
<script src="/js/admin/common.js"></script>
<script src="/js/admin/admin_search.js"></script>
</body>
</html>
