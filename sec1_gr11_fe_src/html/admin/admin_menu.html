<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorMatch - Admin</title>
    <link rel="stylesheet" href="/style/styles.css">
    <style>
        .admin-menu {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
        }

        .admincard {
            width: 50%;
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 20px;
            background-color: #FFFFFF;
            border: 1px solid #FAF7F2;
            border-radius: 15px;
        }

    </style>
</head>
<body>
<header>
    <nav>
        <div class="logo"><a href="/">CreatorMatch</a></div>
        <div id="nav-links"></div>
    </nav>
</header>

<main class="container">
    <h1>Admin</h1>
    <p id="welcome"></p>

<!-- Admin Menu -->
    <section class="admin-menu">
        <a class="admincard" href="/admin/search">
            <h2>Manage Admin</h2>
            <p>Search, add, edit and delete admin accounts.</p>
        </a>

        <a class="admincard" href="/admin/creators">
            <h2>Manage Creator</h2>
            <p>Search, add, edit and delete creators.</p>
        </a>

        <a class="admincard" href="/admin/users">
            <h2>Manage User</h2>
            <p>Search, add, edit and delete user accounts.</p>
        </a>
    </section>
</main>

<footer>
    <p>CreatorMatch &copy; 2026</p>
</footer>

<script src="/js/nav.js"></script>
<script src="/js/admin/menu.js"></script>
</body>
</html>
