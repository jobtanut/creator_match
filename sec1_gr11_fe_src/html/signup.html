<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorMatch - Register</title>
    <link rel="stylesheet" href="/style/styles.css">
</head>
<body>

<header>
    <nav>
        <div class="logo">
            <a href="/">CreatorMatch</a>
        </div>
        <div>
            <a href="/">Home</a>
            <a href="/search">Search Creator</a>
            <a href="/team">Team</a>
            <a href="/auth/login">Login</a>
        </div>
    </nav>
</header>

<main>
    <section class="login-box">
        <h1>Create Account</h1>

        <form action="http://localhost:3030/signup" method="POST">
            <p class="error"></p>

            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="first_name" placeholder="Enter your first name" maxlength="50" required>

            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="last_name" placeholder="Enter your last name" maxlength="50" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" maxlength="100" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" maxlength="30" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Enter your password again" minlength="8" required>

            <div class="login-button">
                <button class="button" type="submit">Register</button>
            </div>
        </form>

        <p class="small-text">
            Already have an account?
            <a href="/auth/login">Login</a>
        </p>
    </section>
</main>

<script src="/nav.js"></script>
</body>
</html>
