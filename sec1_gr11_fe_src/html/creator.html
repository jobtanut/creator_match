<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorMatch - Creator Detail</title>
    <link rel="stylesheet" href="/style/styles.css">
</head>
<body>
<header>
    <nav>
        <div class="logo"><a href="/">CreatorMatch</a></div>
        <div id="nav-links"></div>
    </nav>
</header>

<main class="container">
    <article class="creator-detail" id="creatorDetail">
        <img id="creatorPicture" src="https://placehold.co/400x400" alt="">

        <section>
            <h1 id="creatorName">Loading...</h1>
            <h3 id="creatorRealName"></h3>
            <p><b>Category:</b> <span id="creatorCategory"></span></p>
            <p><b>Platforms:</b> <span id="creatorPlatforms"></span></p>

            <h3>About Creator</h3>
            <p id="creatorDescription"></p>

            <a class="button" href="/">Back to Homepage</a>
            <a class="button" href="/search">Back to Search</a>
        </section>
    </article>
</main>

<footer>
    <p>CreatorMatch &copy; 2026</p>
</footer>

<script src="/js/nav.js"></script>
<script src="/js/creator.js"></script>
</body>
</body>
</html>
